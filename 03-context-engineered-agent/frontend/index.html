<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example 3 · Context-Engineered Travel Agent</title>

  <!-- Tailwind CSS (v4 browser build), React 18, Babel (compiles app.jsx in the browser),
       marked + DOMPurify for rendering the agent's markdown safely. No build step needed. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    /* Styling for markdown rendered inside chat bubbles */
    .md p { margin: 0.4rem 0; }
    .md ul, .md ol { margin: 0.4rem 0 0.4rem 1.25rem; list-style: disc; }
    .md ol { list-style: decimal; }
    .md h1, .md h2, .md h3 { font-weight: 600; margin: 0.75rem 0 0.25rem; }
    .md h2 { font-size: 1.05rem; } .md h3 { font-size: 1rem; }
    .md blockquote { border-left: 3px solid #c7d2fe; padding-left: 0.6rem; color: #475569; margin: 0.4rem 0; }
    .md table { border-collapse: collapse; margin: 0.5rem 0; font-size: 0.8rem; width: 100%; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid #e2e8f0; padding: 0.25rem 0.5rem; text-align: left; white-space: nowrap; }
    .md th { background: #f1f5f9; font-weight: 600; }
    .md code { background: #f1f5f9; padding: 0 0.25rem; border-radius: 0.25rem; font-size: 0.85em; }
    .md strong { font-weight: 600; }
    .md a { color: #4f46e5; text-decoration: underline; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root">
    <p class="p-8 text-slate-500">Loading the travel agent UI… (this needs internet access for the CDN scripts)</p>
  </div>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
